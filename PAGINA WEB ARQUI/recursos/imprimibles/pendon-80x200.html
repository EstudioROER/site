<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Pendón 80x200 - Estudio ROER</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b;
            --accent: #d4af37;
            --bg: #ffffff;
            --text: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            width: 80cm;
            height: 200cm;
            margin: 0 auto;
            background: white;
            color: var(--text);
            position: relative;
            overflow: hidden;
        }

        .container {
            padding: 5cm;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .logo-section {
            margin-top: 5cm;
        }

        .brand {
            font-size: 3cm;
            letter-spacing: 0.5cm;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 700;
            display: block;
            border: 2mm solid var(--primary);
            padding: 1cm 3cm;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 8cm;
            color: var(--primary);
            line-height: 1.1;
            margin: 5cm 0;
        }

        .highlight {
            color: var(--accent);
            display: block;
        }

        .services-list {
            font-size: 3cm;
            line-height: 1.5;
            color: #475569;
            font-weight: 600;
        }

        .service-item {
            display: block;
            margin-bottom: 2cm;
            border-bottom: 2mm solid var(--accent);
            padding-bottom: 1cm;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
        }

        .qr-section {
            margin-bottom: 5cm;
            background: var(--primary);
            color: white;
            padding: 3cm;
            border-radius: 2cm;
            width: 100%;
        }

        .qr-title {
            font-size: 3cm;
            font-weight: bold;
            display: block;
            margin-bottom: 2cm;
            color: var(--accent);
        }

        .qr-placeholder {
            width: 25cm;
            height: 25cm;
            background: white;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2cm;
            color: #ccc;
            border: 5mm solid white;
        }

        .footer {
            font-size: 2cm;
            color: #64748b;
            margin-bottom: 5cm;
        }

        /* Print Settings */
        @page {
            size: 80cm 200cm;
            margin: 0;
        }

        @media print {
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .btn-download {
                display: none;
            }
        }

        .btn-download {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--accent);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }
    </style>
</head>

<body>

    <a href="#" class="btn-download" onclick="window.print()">🖨️ Imprimir Pendón</a>

    <div class="container">
        <div class="logo-section">
            <span class="brand">ESTUDIO ROER</span>
        </div>

        <h1>
            ARQUITECTURA
            <span class="highlight">& GESTIÓN</span>
        </h1>

        <div class="services-list">
            <span class="service-item">REGULARIZACIONES</span>
            <span class="service-item">AMPLIACIONES</span>
            <span class="service-item">OBRA NUEVA</span>
        </div>

        <div class="qr-section">
            <span class="qr-title">EVALUACIÓN GRATIS</span>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data=https://www.estudioroer.com/feria.html"
                class="qr-placeholder" alt="QR Code">
            <p style="margin-top: 1cm; font-size: 2cm;">ESCANEA AQUÍ</p>
        </div>

        <div class="footer">
            www.estudioroer.com
        </div>
    </div>
</body>

</html>
