<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand Color: #000000 (Black as per photo) -->
  <rect width="1000" height="300" fill="transparent" />
  
  <!-- Icon ROER (High-fidelity trace of the provided photo) -->
  <g transform="translate(60, 50)" style="stroke: #000000; stroke-width: 17; fill: none; stroke-linejoin: miter; stroke-linecap: square;">
    <!-- Main Outer Hook (r-structure) -->
    <!-- Straight left, Straight top, Rounded corner, Straight down, Sharp curve inward, Straight right, Small end -->
    <path d="M 0, 200 L 0, 0 L 140, 0 C 180, 0 180, 10 180, 50 L 180, 100 C 180, 150 220, 150 250, 150 L 280, 150 L 280, 110" />
    
    <!-- Nested Inner Path (L-structure) -->
    <!-- Straight top, Straight right, Rounded bottom-left, Straight left -->
    <path d="M 50, 50 L 130, 50 L 130, 150 C 130, 190 120, 200 80, 200 L 50, 200" />
  </g>

  <!-- Text Section -->
  <g transform="translate(450, 70)">
    <!-- Acronym ROER -->
    <text x="0" y="80" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="110" fill="#000000" letter-spacing="2">ROER</text>
    
    <!-- Full Name -->
    <text x="2" y="160" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="22" fill="#000000" letter-spacing="1">
        REGULARIZACIÓN Y OPTIMIZACIÓN DE ESPACIOS RESIDENCIALES
    </text>
    
    <!-- Decorative Line (Optional, but adds to the premium feel) -->
    <line x1="0" y1="190" x2="650" y2="190" stroke="#000000" stroke-width="2" opacity="0.3" />
  </g>
</svg>
