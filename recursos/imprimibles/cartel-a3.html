<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cartel A3 - Estudio ROER</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b;
            --accent: #d4af37;
            --love: #be123c;
            --bg: #ffffff;
            --text: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            width: 297mm;
            height: 420mm;
            margin: 0 auto;
            background: white;
            color: var(--text);
            position: relative;
            overflow: hidden;
            border: 1px dashed #ddd;
            /* Visual guide */
        }

        .container {
            padding: 20mm;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* Decorative border */
        .container::before {
            content: '';
            position: absolute;
            top: 10mm;
            left: 10mm;
            right: 10mm;
            bottom: 10mm;
            border: 2mm solid var(--accent);
            z-index: -1;
        }

        .brand {
            font-size: 14pt;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 700;
            display: block;
            margin-bottom: 10mm;
            background: white;
            padding: 0 10mm;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48pt;
            color: var(--primary);
            line-height: 1.1;
            margin-bottom: 5mm;
        }

        .highlight {
            color: var(--love);
            font-style: italic;
            display: block;
            font-size: 36pt;
            margin-top: 5mm;
        }

        .special-offer {
            background: var(--primary);
            color: white;
            padding: 10mm 20mm;
            border-radius: 5mm;
            margin: 15mm 0;
            box-shadow: 0 10mm 20mm rgba(0, 0, 0, 0.1);
        }

        .offer-text {
            font-size: 24pt;
            font-weight: bold;
            display: block;
            margin-bottom: 5mm;
        }

        .offer-sub {
            font-size: 18pt;
            color: var(--accent);
        }

        .qr-section {
            margin-top: 10mm;
        }

        .qr-code {
            width: 80mm;
            height: 80mm;
            border: 2mm solid white;
            box-shadow: 0 5mm 15mm rgba(0, 0, 0, 0.15);
        }

        .cta {
            font-size: 18pt;
            font-weight: 600;
            color: var(--primary);
            margin-top: 10mm;
        }

        .footer {
            position: absolute;
            bottom: 20mm;
            font-size: 12pt;
            color: #64748b;
        }

        /* Print Settings */
        @page {
            size: A3 portrait;
            margin: 0;
        }

        @media print {
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                border: none;
            }

            .btn-download {
                display: none;
            }
        }

        .btn-download {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <a href="#" class="btn-download" onclick="window.print()">🖨️ Imprimir Cartel A3</a>

    <div class="container">
        <span class="brand">Estudio ROER</span>

        <h1>
            TU HOGAR
            <span class="highlight">Empieza Aquí</span>
        </h1>

        <div class="special-offer">
            <span class="offer-text">EVALUACIÓN GRATUITA</span>
            <span class="offer-sub">Especial Feria • Febrero 2026</span>
        </div>

        <div class="qr-section">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https://www.estudioroer.com/feria.html"
                class="qr-code" alt="QR Code">
            <div class="cta">Escanea para Consultar</div>
        </div>

        <div class="footer">
            Regularizaciones • Ampliaciones • Obra Nueva
        </div>
    </div>
</body>

</html>
