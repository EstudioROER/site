<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta de Premios - Estudio ROER</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #d4af37;
            --bg: #fff0f5;
            --text: #333;
            --white: #ffffff;
            --love: #e11d48;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-y: auto;
            /* Allow scrolling */
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--love);
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-align: center;
        }

        .wheel-container {
            position: relative;
            width: 80vmin;
            height: 80vmin;
            max-width: 320px;
            max-height: 320px;
            margin: 10px auto;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 10px solid var(--white);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            background: conic-gradient(#FF9AA2 0deg 60deg,
                    #FFB7B2 60deg 120deg,
                    #FFDAC1 120deg 180deg,
                    #E2F0CB 180deg 240deg,
                    #B5EAD7 240deg 300deg,
                    #C7CEEA 300deg 360deg);
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--primary);
            z-index: 20;
        }

        .btn-spin {
            background: var(--love);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
            transition: transform 0.2s;
        }

        .btn-spin:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-spin:active {
            transform: scale(0.95);
        }

        #result {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            min-height: 40px;
            text-align: center;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }

        .back-link {
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
            max-width: 400px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            color: #555;
            font-weight: 600;
        }

        .color-box {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
    </style>
</head>

<body>

    <h1>¡Gira y Gana! 🎁</h1>
    <p style="color: #666; text-align: center;">Premios instantáneos para tu hogar</p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
            <div class="wheel-center">ROER</div>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="color-box" style="background: #FF9AA2;"></span> Fotomontaje IA + Asesoría
        </div>
        <div class="legend-item"><span class="color-box" style="background: #FFB7B2;"></span> 5% Dcto. Regularización
        </div>
        <div class="legend-item"><span class="color-box" style="background: #FFDAC1;"></span> Guía Impresa Regalo</div>
        <div class="legend-item"><span class="color-box" style="background: #E2F0CB;"></span> Asesoría Express</div>
        <div class="legend-item"><span class="color-box" style="background: #B5EAD7;"></span> 10% Dcto. Diseño</div>
        <div class="legend-item"><span class="color-box" style="background: #C7CEEA;"></span> Inténtalo de nuevo</div>
    </div>

    <div id="result"></div>
    <button class="btn-spin" id="spinBtn" onclick="spin()">GIRAR AHORA</button>

    <a href="feria.html" class="back-link">← Volver al Hub</a>

    <script>
        const wheel = document.getElementById('wheel');
        const resultText = document.getElementById('result');
        const spinBtn = document.getElementById('spinBtn');
        let spinning = false;

        const prizes = [
            "Fotomontaje IA + Asesoría", // 0-60
            "5% Desc. Regularización", // 60-120
            "Guía Impresa de Regalo", // 120-180
            "Asesoría Express (15min)", // 180-240
            "10% Desc. Diseño", // 240-300
            "¡Inténtalo de nuevo!" // 300-360
        ];

        // Forced win for first spin (Evaluación GRATIS is at ~30 deg, need to land there)
        // Since pointer is at TOP (0 deg visually, but rotation logic is tricky)
        // Let's rely on random for fun but Bias towards "Evaluación GRATIS"

        // Defined probabilities (Total must sum to 100 or logic accommodates)
        const prizeWeights = [
            { id: 0, prize: "Fotomontaje IA + Asesoría", weight: 0.05 },  // 5% - Very Rare
            { id: 1, prize: "5% Desc. Regularización", weight: 0.15 },    // 15%
            { id: 2, prize: "Guía Impresa de Regalo", weight: 0.25 },     // 25% - Common
            { id: 3, prize: "Asesoría Express (15min)", weight: 0.20 },   // 20%
            { id: 4, prize: "10% Desc. Diseño", weight: 0.10 },           // 10%
            { id: 5, prize: "¡Inténtalo de nuevo!", weight: 0.25 }        // 25% - Common
        ];

        function spin() {
            if (spinning) return;
            spinning = true;
            spinBtn.disabled = true;
            resultText.textContent = "";

            // 1. Select prize based on weights
            let random = Math.random();
            let selectedPrizeIndex = 0;
            let currentWeight = 0;

            for (let i = 0; i < prizeWeights.length; i++) {
                currentWeight += prizeWeights[i].weight;
                if (random <= currentWeight) {
                    selectedPrizeIndex = i;
                    break;
                }
            }

            // 2. Calculate Angle to land on selected prize
            // Each slice is 60 degrees.
            // Index 0: 0-60, Index 1: 60-120...
            // Target Angle Visual: The pointer is at TOP (0 deg).
            // To land on Index 0 (0-60 deg slice), we need the wheel to rotate such that 
            // the 0-60 slice is at the top.
            // Actually, in CSS conic-gradient starts at 0deg (Top usually or Right depending on browser, here likely Top).
            // Rotation is clockwise.
            // If we rotate X degrees, the slice at Top is (360 - (X % 360)).
            // We want (360 - X) to be inside [Index*60, (Index+1)*60].
            // So X should be roughly: 360 - (Index * 60 + random_offset)

            const sliceSize = 360 / prizeWeights.length;
            const targetIndex = selectedPrizeIndex;

            // Randomize position within the slice (add buffer to ensure not on line)
            const minAngle = targetIndex * sliceSize + 5;
            const maxAngle = (targetIndex + 1) * sliceSize - 5;
            const randomAngleInSlice = Math.floor(Math.random() * (maxAngle - minAngle + 1)) + minAngle;

            // Calculate rotation needed
            // We need to keep adding to the current rotation to make it spin forward always.

            if (typeof currentRotation === 'undefined') {
                currentRotation = 0;
            }

            const extraSpins = 5 * 360; // 5 full spins minimum

            const targetRotationForThisSpin = (360 - randomAngleInSlice); // This is where we want to end up (0-359)
            const currentMod = currentRotation % 360;
            let distance = targetRotationForThisSpin - currentMod;
            if (distance < 0) distance += 360;

            const totalDegreesToAdd = extraSpins + distance;
            currentRotation += totalDegreesToAdd;

            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                spinning = false;
                spinBtn.disabled = false;
                spinBtn.textContent = "GIRAR OTRA VEZ";

                const prize = prizeWeights[selectedPrizeIndex].prize;

                if (prize.includes("Fotomontaje")) {
                    resultText.innerHTML = `🎉 ¡GANASTE EL PREMIO MAYOR!<br><span style="font-size: 1rem; color: #555;">Tómate una foto con tu pareja AHORA.<br>Recibe tu montaje en 24h.</span>`;
                } else if (prize.includes("nuevo")) {
                    resultText.innerHTML = `🎫 ¡Saca un cupón del frasco!<br><span style="font-size: 1rem; color: #555;">Tu suerte está en el frasco.</span>`;
                } else {
                    resultText.textContent = `🎉 Ganaste: ${prize}`;
                }

                if (!prize.includes("nuevo")) {
                    celebrate();
                }

            }, 4000);
        }

        function celebrate() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = -10 + 'px';
                confetti.style.backgroundColor = ['#FF9AA2', '#FFB7B2', '#FFDAC1', '#E2F0CB', '#B5EAD7', '#C7CEEA'][Math.floor(Math.random() * 6)];
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 5000);
            }
        }
    </script>

</body>

</html>
