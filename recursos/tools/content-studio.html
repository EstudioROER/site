<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Studio Pro - Estudio ROER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --bg-input: #f9fafb;
            --accent: #3FB8AF;
            /* Color original más suave */
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-body);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            background: var(--bg-card);
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
            z-index: 10;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
            color: var(--text);
            /* Sin gradiente raro */
        }

        .header-logo img {
            width: 32px;
            height: 32px;
        }

        .header-tabs {
            display: flex;
            gap: 0.25rem;
            background: var(--bg-input);
            border-radius: 8px;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .header-tab {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .header-tab:hover {
            color: var(--text);
            background: rgba(0, 0, 0, 0.05);
        }

        .header-tab.active {
            background: #fff;
            color: var(--accent);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .app-container {
            display: grid;
            grid-template-columns: 340px 1fr 360px;
            height: calc(100vh - 66px);
            /* Adjusted height */
        }

        .sidebar,
        .right-panel {
            background: var(--bg-card);
            border-color: var(--border);
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            overflow-y: auto;
            /* Ensure scroll */
        }

        .sidebar {
            border-right: 1px solid var(--border);
        }

        .right-panel {
            border-left: 1px solid var(--border);
        }

        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sidebar-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
            font-weight: 600;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.6rem;
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(63, 184, 175, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            filter: brightness(0.95);
            box-shadow: 0 2px 4px rgba(63, 184, 175, 0.3);
        }

        .btn-secondary {
            background: #fff;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #f9fafb;
            border-color: #d1d5db;
        }

        .btn-random {
            background: linear-gradient(135deg, #FF6B6B, #EE5253);
            color: white;
        }

        .btn-random:hover {
            box-shadow: 0 4px 12px rgba(238, 82, 83, 0.25);
        }

        .week-calendar {
            background: #f8fafc;
            border: 1px solid var(--border);
            box-shadow: none;
            border-radius: 8px;
            padding: 0.8rem;
        }

        .week-title {
            color: var(--text);
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .day-btn {
            padding: 0.4rem 0.2rem;
            border-radius: 6px;
            font-size: 0.7rem;
            opacity: 0.8;
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .day-btn:hover {
            opacity: 1;
            background: #f0f9ff;
            border-color: var(--accent);
        }

        .day-btn.active {
            opacity: 1;
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(63, 184, 175, 0.2);
            color: var(--accent);
        }

        .day-btn .day-icon {
            font-size: 1.2rem;
            margin-bottom: 0.2rem;
        }

        /* Theme Palette */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .theme-btn {
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .theme-btn:hover {
            transform: scale(1.15);
            border-color: rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        .theme-btn.active {
            border-color: var(--accent);
            transform: scale(1.15);
            box-shadow: 0 0 0 2px var(--accent);
            z-index: 2;
        }

        /* Format Buttons */
        .format-row {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .format-btn {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.4rem 0.8rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .format-btn:hover {
            background: #f9fafb;
            color: var(--text);
            border-color: #d1d5db;
        }

        .format-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-weight: 700;
            box-shadow: 0 2px 4px rgba(63, 184, 175, 0.3);
        }

        /* Bg Upload Improved */
        .bg-upload-container {
            position: relative;
        }

        .bg-upload {
            background: #f9fafb;
            border-radius: 8px;
            padding: 1rem;
            border: 2px dashed var(--border);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
        }

        .bg-upload:hover {
            border-color: var(--accent);
            background: #f0fdfa;
        }

        .bg-preview {
            width: 100%;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 0.5rem;
            display: none;
            border: 1px solid var(--border);
        }

        .bg-preview.active {
            display: block;
        }

        .bg-controls {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .bg-controls .btn {
            flex: 1;
            font-size: 0.7rem;
            padding: 0.4rem;
        }

        #bgInput {
            display: none !important;
        }

        .canvas-area {
            background: #e5e7eb;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: hidden;
            /* Prevent canvas overflow */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Canvas Pro Styles */
        .post-canvas {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-radius: 0;

            position: relative;
            z-index: 1;
            /* Ensure content stays inside */
            overflow: hidden;
        }

        .canvas-label {
            display: none !important;
        }

        .post-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            transition: background 0.3s ease;
        }

        .post-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            display: none;
        }

        .post-bg-img.active {
            display: block;
        }

        .post-badge {
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 2;
        }

        .post-title {
            font-weight: 800;
            letter-spacing: -0.03em;
            position: relative;
            z-index: 2;
        }

        .post-subtitle {
            font-weight: 400;
            opacity: 0.95;
            letter-spacing: -0.01em;
            position: relative;
            z-index: 2;
        }

        .post-cta {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
            letter-spacing: 0.02em;
            position: relative;
            z-index: 2;
        }

        .post-logo {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 0.4em;
            font-weight: 700;
        }

        .post-logo img {
            object-fit: contain;
        }

        .post-contact {
            position: absolute;
            opacity: 0.8;
        }

        @media (max-width: 1200px) {
            .app-container {
                grid-template-columns: 280px 1fr;
            }

            .right-panel {
                display: none;
            }
        }

        /* Sidebar Tabs Styles */
        .sidebar-tabs {
            display: flex;
            background: var(--bg-card);
            margin: -0.8rem -0.8rem 0.8rem -0.8rem;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.8rem;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }

        .sidebar-tab:hover {
            color: var(--text);
            background: rgba(0, 0, 0, 0.05);
        }

        .sidebar-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(63, 184, 175, 0.05);
        }
    </style>
    <script>
        function switchSidebarTab(tab) {
            // Update buttons
            document.querySelectorAll('.sidebar-tab').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            // Toggle Panels
            if (tab === 'content') {
                document.getElementById('tab-content-panel').style.display = 'block';
                document.getElementById('tab-design-panel').style.display = 'none';
            } else {
                document.getElementById('tab-content-panel').style.display = 'none';
                document.getElementById('tab-design-panel').style.display = 'block';
            }
        }
    </script>
</head>

<body>
    <header class="header">
        <div class="header-logo">
            <img src="../../sitio-web/assets/images/logo.png" alt="ROER" onerror="this.style.display='none'">
            <span>Content Studio Pro</span>
        </div>
        <div class="header-tabs">
            <button class="header-tab active" data-network="instagram" onclick="switchNetwork('instagram')">📷
                IG</button>
            <button class="header-tab" data-network="x" onclick="switchNetwork('x')">𝕏</button>
            <button class="header-tab" data-network="facebook" onclick="switchNetwork('facebook')">📘 FB</button>
        </div>
        <div class="header-actions">
            <button class="btn btn-random" onclick="randomize()">🎲 Aleatorio</button>
            <button class="btn btn-primary" onclick="downloadAll()">📥 Descargar</button>
        </div>
    </header>

    <div class="app-container">
        <aside class="sidebar">
            <!-- Sidebar Tabs -->
            <div class="sidebar-tabs">
                <button class="sidebar-tab active" onclick="switchSidebarTab('content')">✏️ Contenido</button>
                <button class="sidebar-tab" onclick="switchSidebarTab('design')">🎨 Diseño</button>
            </div>

            <!-- Tab: Content -->
            <div id="tab-content-panel">
                <div class="week-calendar">
                    <div class="week-title">📅 Semana de Contenido</div>
                    <div class="week-days" id="weekDays"></div>
                    <div class="week-actions">
                        <button class="btn btn-primary" onclick="generateWeek()">🔄 Generar</button>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="sidebar-section">
                    <div class="sidebar-title">✏️ <span id="dayLabel">Lunes</span></div>
                    <div class="input-group">
                        <label>Top Badge</label>
                        <input type="text" id="badgeText" oninput="updateContent()">
                    </div>
                    <div class="input-group">
                        <label>Título (*negrita*)</label>
                        <textarea id="titleText" oninput="updateContent()" rows="3"></textarea>
                    </div>
                    <div class="input-group">
                        <label>Subtítulo</label>
                        <textarea id="subtitleText" oninput="updateContent()" rows="4"></textarea>
                    </div>
                    <div class="input-group">
                        <label>Botón CTA</label>
                        <input type="text" id="ctaText" oninput="updateContent()">
                    </div>
                </div>
            </div>

            <!-- Tab: Design -->
            <div id="tab-design-panel" style="display: none;">
                <div class="sidebar-section">
                    <div class="sidebar-title">📱 Formato</div>
                    <div class="format-row" id="formatRow"></div>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">🎨 Tema de Color</div>
                    <div class="theme-grid" id="themeGrid"></div>
                    <div class="input-group" style="margin-top:10px;">
                        <label>Color Resaltado (*texto*)</label>
                        <input type="color" id="highlightColor" value="#3FB8AF" oninput="updateContent()"
                            style="width:100%;height:35px;border:none;border-radius:5px;cursor:pointer;">
                    </div>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">🖼️ Fondo Personalizado</div>
                    <div class="bg-upload-container">
                        <div class="bg-upload" onclick="document.getElementById('bgInput').click()">
                            <input type="file" id="bgInput" accept="image/*" onchange="handleBgUpload(event)">
                            <label class="bg-upload-label">
                                <span style="font-size:1.5rem">📷</span>
                                <span>Subir imagen</span>
                            </label>
                        </div>
                        <img class="bg-preview" id="bgPreview" alt="Preview">
                        <div class="bg-controls" id="bgControls" style="display:none;">
                            <button class="btn btn-secondary" onclick="removeBg()">Quitar</button>
                            <button class="btn btn-secondary" onclick="toggleOverlay()">Oscurecer</button>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="canvas-area">
            <div class="canvas-label" id="canvasLabel">Instagram Post • 1080×1080px</div>
            <div class="post-canvas" id="postCanvas" style="background: transparent;"> <!-- Force transparent -->
                <div class="post-bg" id="postBg"></div> <!-- CSS handles color -->
                <img class="post-bg-img" id="postBgImg" alt="">
                <div class="post-overlay" id="postOverlay"></div>
                <div class="post-logo" id="postLogo">
                    <img src="../../sitio-web/assets/images/logo.png" alt="ROER" onerror="this.style.display='none'">
                    <span id="postLogoText">Estudio ROER</span>
                </div>
                <div class="post-content" id="postContent">
                    <div class="post-badge" id="postBadge"></div>
                    <h1 class="post-title" id="postTitle"></h1>
                    <p class="post-subtitle" id="postSubtitle"></p>
                    <div class="post-cta" id="postCta"></div>
                </div>
                <div class="post-contact" id="postContact">estudioroer.com</div>
            </div>
        </main>

        <aside class="right-panel">
            <div class="bio-section">
                <div class="bio-title">📝 Caption / Bio</div>
                <div class="bio-text" id="bioText" contenteditable="true"></div>
                <div class="bio-chars" id="bioChars">0 chars</div>
                <div class="bio-actions">
                    <button class="btn btn-primary" onclick="copyBio()">📋 Copiar</button>
                    <button class="btn btn-secondary" onclick="regenerateBio()">🔄 Otra</button>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">🔗 Hashtags</div>
                <div class="hashtags" id="hashtags">#Arquitectura #Chile #Regularización</div>
            </div>

            <div class="download-section">
                <div class="sidebar-title">📥 Descargar</div>
                <div
                    style="margin-bottom: 0.8rem; border: 1px dashed var(--border); padding: 0.5rem; border-radius: 6px;">
                    <button class="btn btn-secondary btn-block" onclick="selectFolder()"
                        style="font-size: 0.8rem; margin-bottom: 0.2rem;">📂 Seleccionar Carpeta</button>
                    <div id="selectedFolderText"
                        style="font-size: 0.7rem; color: var(--text-muted); text-align: center;">Por defecto: Descargas
                    </div>
                </div>
                <button class="btn btn-success btn-block" onclick="downloadAll()">📥 Semana Completa</button>
                <div class="download-grid">
                    <button class="btn btn-secondary" onclick="downloadCurrent('png')">PNG</button>
                    <button class="btn btn-secondary" onclick="downloadCurrent('jpg')">JPG</button>
                </div>
            </div>
        </aside>
    </div>

        function init() {
            const weekDays = document.getElementById('weekDays');
            days.forEach((d, i) => {
                const btn = document.createElement('button');
                btn.className = 'day-btn ' + d.id + (i === 0 ? ' active' : '');
                btn.innerHTML = '<span class="day-icon">' + d.icon + '</span>' + d.name.substring(0, 2);
                btn.onclick = () => selectDay(i);
                weekDays.appendChild(btn);
            });

            const themeGrid = document.getElementById('themeGrid');
            themes.forEach((t, i) => {
                const btn = document.createElement('button');
                btn.className = 'theme-btn' + (i === 0 ? ' active' : '');
                btn.style.background = t.gradient;
                if (t.gradient === '#ffffff' || t.gradient === '#faf8f5') btn.style.border = '1px solid #555';
                btn.onclick = () => { currentTheme = i; document.querySelectorAll('.theme-btn').forEach((b, idx) => b.classList.toggle('active', idx === i)); renderCanvas(); };
                themeGrid.appendChild(btn);
            });

            generateWeek();
            renderFormats();
        }

        // Background Upload
        function handleBgUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (ev) {
                    customBgUrl = ev.target.result;
                    document.getElementById('bgPreview').src = customBgUrl;
                    document.getElementById('bgPreview').classList.add('active');
                    document.getElementById('bgControls').style.display = 'flex';
                    document.getElementById('postBgImg').src = customBgUrl;
                    document.getElementById('postBgImg').classList.add('active');
                    document.getElementById('postBg').style.display = 'none';
                    renderCanvas();
                };
                reader.readAsDataURL(file);
            }
        }

        function removeBg() {
            customBgUrl = null;
            document.getElementById('bgPreview').classList.remove('active');
            document.getElementById('bgControls').style.display = 'none';
            document.getElementById('postBgImg').classList.remove('active');
            document.getElementById('postBg').style.display = 'block';
            document.getElementById('postOverlay').classList.remove('active');
            overlayActive = false;
            document.getElementById('bgInput').value = '';
            renderCanvas();
        }

        function toggleOverlay() {
            overlayActive = !overlayActive;
            document.getElementById('postOverlay').classList.toggle('active', overlayActive);
        }

            else if (cta.match(/ver|caso|proyect|obra|diseñ|transform|antes|despu/)) pureUrl = 'estudioroer.com/proyectos';
            else if (cta.match(/hable|whatsapp|escrib|contact|duda|pregu|coment|ayuda|hola/)) pureUrl = 'wa.me/56950196861';
            else if (cta.match(/leer|blog|info|articulo|guia|tip|educa|aprend|sabias|entender|conocer/)) pureUrl = 'estudioroer.com/blog';
            else if (cta.match(/empez|inici|arranc|primer|paso|accion|hoy|ahora|ya/)) pureUrl = 'estudioroer.com/contacto';
            else if (cta.match(/prom|oferta|desc|regalo|gratis|cupo/)) pureUrl = 'estudioroer.com/promo';

            let bio = '';
            const tags = networks[currentNetwork].hashtags;

            // 2. Formatear según Red Social
            if (currentNetwork === 'instagram') {
                // IG: Estilo visual, bloques, Link en Bio

            else if (currentNetwork === 'x') {
                // X: Conciso, URL directa, menos hashtags

        function renderCanvas() {
            const net = networks[currentNetwork];
            const f = net.formats[currentFormat];
            const t = themes[currentTheme];
            const d = days[currentDay];
            const c = weekContent[d.id];
            const highlight = document.getElementById('highlightColor').value;

            const canvas = document.getElementById('postCanvas');
            const ratio = f.h / f.w;

            // Detect format type
            const isStory = ratio > 1.5;           // Very tall (9:16)
            const isCarousel = ratio > 1.1 && ratio <= 1.5;  // Tall (4:5)
            const isSquare = ratio >= 0.9 && ratio <= 1.1;   // Square (1:1)
            const isHorizontal = ratio < 0.9;       // Wide (16:9, etc)

            const scale = isStory ? Math.min(0.26, 320 / f.h)
                : isCarousel ? Math.min(0.32, 380 / f.h)
                    : isHorizontal ? Math.min(0.45, 450 / f.w)
                        : Math.min(0.38, 380 / f.w);

            canvas.style.width = f.w * scale + 'px';
            canvas.style.height = f.h * scale + 'px';

            // Adjust base size per format
            let baseSize, paddingVal, paddingTop, gapSize;

            if (isStory) {
                baseSize = f.w * 0.045 * scale;
                paddingVal = '8%'; paddingTop = '25%'; gapSize = 1.2;
            } else if (isCarousel) {
                baseSize = f.w * 0.042 * scale;
                paddingVal = '8%'; paddingTop = '18%'; gapSize = 1;
            } else if (isHorizontal) {
                baseSize = f.h * 0.055 * scale;
                paddingVal = '6%'; paddingTop = '6%'; gapSize = 0.6;
            } else { // Square
                baseSize = f.w * 0.04 * scale;
                paddingVal = '8%'; paddingTop = '8%'; gapSize = 0.7;
            }

            // Background Logic
            const bgDiv = document.getElementById('postBg');
            const bgImg = document.getElementById('postBgImg');
            const overlay = document.getElementById('postOverlay');

            if (customBgUrl) {
                bgDiv.style.display = 'none';
                bgImg.style.display = 'block';
                bgImg.src = customBgUrl;
                overlay.style.display = overlayActive ? 'block' : 'none';
            } else {
                bgDiv.style.display = 'block';
                bgImg.style.display = 'none';
                overlay.style.display = 'none';

                // FORCE RESET background styles to avoid conflicts
                bgDiv.style.background = '';
                bgDiv.style.backgroundColor = '';
                bgDiv.style.backgroundImage = '';

                // Apply new background
                requestAnimationFrame(() => {
                    bgDiv.style.background = t.gradient;
                });
            }

            const content = document.getElementById('postContent');
            content.style.padding = paddingVal;
            content.style.paddingTop = paddingTop;
            content.style.paddingBottom = isStory ? '20%' : paddingVal;
            content.style.gap = baseSize * gapSize + 'px';
            content.style.justifyContent = (isStory || isCarousel) ? 'flex-start' : 'center';

            // Badge
            const badge = document.getElementById('postBadge');
            badge.textContent = c.badge;
            badge.style.background = t.badge;
            badge.style.color = t.badgeText;
            const badgeSize = isStory ? 1 : isCarousel ? 0.9 : isHorizontal ? 0.85 : 0.8;
            badge.style.fontSize = baseSize * badgeSize + 'px';
            badge.style.padding = isHorizontal ? '0.4em 0.9em' : '0.5em 1em';
            badge.style.display = c.badge ? 'inline-block' : 'none';

            // Title
            const title = document.getElementById('postTitle');
            title.innerHTML = parseHighlight(c.title, highlight);
            title.style.color = customBgUrl ? '#fff' : t.text;
            const titleSize = isStory ? 2.5 : isCarousel ? 2.2 : isHorizontal ? 2.4 : 2;
            title.style.fontSize = baseSize * titleSize + 'px';
            title.style.lineHeight = isHorizontal ? '1.1' : '1.2';
            if (customBgUrl) title.style.textShadow = '2px 2px 8px rgba(0,0,0,0.7)';
            else title.style.textShadow = 'none';

            // Subtitle
            const sub = document.getElementById('postSubtitle');
            sub.innerHTML = parseHighlight(c.subtitle, highlight);
            sub.style.color = customBgUrl ? '#fff' : t.text;
            const subSize = isStory ? 1.3 : isCarousel ? 1.1 : isHorizontal ? 1.15 : 1;
            sub.style.fontSize = baseSize * subSize + 'px';
            sub.style.lineHeight = isHorizontal ? '1.4' : '1.5';
            sub.style.marginTop = (isStory || isCarousel) ? baseSize * 0.4 + 'px' : '0';
            if (customBgUrl) sub.style.textShadow = '1px 1px 4px rgba(0,0,0,0.7)';
            else sub.style.textShadow = 'none';

            // CTA
            const cta = document.getElementById('postCta');
            cta.textContent = c.cta;
            cta.style.background = t.accent;
            cta.style.color = (t.accent === '#fff' || t.accent === '#ffffff') ? '#222' : '#fff';
            const ctaSize = isStory ? 1.1 : isCarousel ? 1 : isHorizontal ? 0.95 : 0.85;
            cta.style.fontSize = baseSize * ctaSize + 'px';
            cta.style.padding = isHorizontal ? '0.6em 1.2em' : '0.7em 1.3em';
            cta.style.marginTop = (isStory || isCarousel) ? baseSize * 0.6 + 'px' : '0';
            cta.style.display = c.cta ? 'inline-block' : 'none';

            // Logo
            const logo = document.getElementById('postLogo');
            logo.style.top = isHorizontal ? '6%' : '4%';
            logo.style.right = isHorizontal ? '4%' : '5%';
            const logoSize = isStory ? 1 : isCarousel ? 0.9 : isHorizontal ? 0.85 : 0.8;
            logo.style.fontSize = baseSize * logoSize + 'px';
            document.querySelector('.post-logo img').style.width = baseSize * (logoSize * 1.6) + 'px';
            document.querySelector('.post-logo img').style.height = baseSize * (logoSize * 1.6) + 'px';
            document.getElementById('postLogoText').style.color = customBgUrl ? '#fff' : t.text;
            if (customBgUrl) document.getElementById('postLogoText').style.textShadow = '1px 1px 3px rgba(0,0,0,0.7)';
            else document.getElementById('postLogoText').style.textShadow = 'none';

            // Contact
            const contact = document.getElementById('postContact');
            contact.style.bottom = '3%';
            contact.style.left = '4%';
            contact.style.fontSize = baseSize * 0.55 + 'px';
            contact.style.color = customBgUrl ? '#fff' : t.text;
            if (customBgUrl) contact.style.textShadow = '1px 1px 3px rgba(0,0,0,0.7)';
            else contact.style.textShadow = 'none';

            document.getElementById('canvasLabel').textContent = net.name + ' ' + f.name + ' • ' + f.w + '×' + f.h + 'px • ' + d.name;
        }

        function parseHighlight(text, color) {
            return (text || '').replace(/\*([^*]+)\*/g, '<span style="color:' + color + '">$1</span>');
        }

        function randomize() {
            currentTheme = Math.floor(Math.random() * themes.length);
            document.querySelectorAll('.theme-btn').forEach((b, i) => b.classList.toggle('active', i === currentTheme));
            generateWeek();
        }

        function darkenColor(col, amt) {
            let usePound = false;
            if (col[0] == "#") {
                col = col.slice(1);
                usePound = true;
            }
            let num = parseInt(col, 16);
            let r = (num >> 16) + amt;
            if (r > 255) r = 255; else if (r < 0) r = 0;
            let b = ((num >> 8) & 0x00FF) + amt;
            if (b > 255) b = 255; else if (b < 0) b = 0;
            let g = (num & 0x0000FF) + amt;
            if (g > 255) g = 255; else if (g < 0) g = 0;
            return (usePound ? "#" : "") + (g | (b << 8) | (r << 16)).toString(16);
        }

        let savedDirectoryHandle = null;

                document.getElementById('selectedFolderText').textContent = '📂 ' + savedDirectoryHandle.name;

        async function downloadCurrent(format = 'png', cachedBgImg = null) {
            const f = networks[currentNetwork].formats[currentFormat];
            const d = days[currentDay];
            const c = weekContent[d.id];
            const t = themes[currentTheme];
            const isVertical = f.h > f.w;
            const isStory = f.id === 'story' || (f.h / f.w > 1.5) || f.id === 'reel';

            // Configuración Alta Resolución
            const scale = 2;
            const canvasEl = document.createElement('canvas');
            canvasEl.width = f.w * scale;
            canvasEl.height = f.h * scale;
            const ctx = canvasEl.getContext('2d');
            ctx.scale(scale, scale);

            // Cargar imagen de fondo si existe
            if (cachedBgImg) {
                drawCanvasContent(ctx, cachedBgImg);
            } else if (customBgUrl && t.gradient !== '#ffffff' && t.gradient !== '#222') {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = customBgUrl;
                img.onload = () => { drawCanvasContent(ctx, img); };
                img.onerror = () => { drawCanvasContent(ctx, null); }; // Fallback
            } else {
                drawCanvasContent(ctx, null);
            }

            async function drawCanvasContent(ctx, bgImg) {
                // 1. FONDO
                if (bgImg) {
                    const ratio = bgImg.width / bgImg.height;
                    const canvasRatio = f.w / f.h;
                    let sw, sh, sx, sy;
                    if (ratio > canvasRatio) {
                        sh = bgImg.height; sw = bgImg.height * canvasRatio; sx = (bgImg.width - sw) / 2; sy = 0;
                    } else {
                        sw = bgImg.width; sh = bgImg.width / canvasRatio; sx = 0; sy = (bgImg.height - sh) / 2;
                    }
                    // Filtro blur manual para compatibilidad
                    ctx.drawImage(bgImg, sx, sy, sw, sh, 0, 0, f.w, f.h);

                    if (overlayActive) {
                        ctx.fillStyle = 'rgba(0,0,0,0.6)';
                        ctx.fillRect(0, 0, f.w, f.h);
                    }
                } else {
                    if (t.gradient.includes('gradient')) {
                        const colors = t.gradient.match(/#[a-fA-F0-9]{6}/g) || ['#111', '#333'];
                        const grad = ctx.createLinearGradient(0, 0, f.w, f.h);
                        colors.forEach((col, i) => grad.addColorStop(i / (colors.length - 1), col));
                        ctx.fillStyle = grad;
                    } else {
                        ctx.fillStyle = t.gradient;
                    }
                    ctx.fillRect(0, 0, f.w, f.h);

                    // Ruido sutil (Texture)
                    ctx.fillStyle = "rgba(255,255,255,0.035)";
                    for (let i = 0; i < f.w; i += 3) {
                        for (let j = 0; j < f.h; j += 3) {
                            if (Math.random() > 0.6) ctx.fillRect(i, j, 1.5, 1.5);
                        }
                    }
                }

                const baseSize = isStory ? f.w * 0.05 : Math.min(f.w, f.h) * 0.045;
                const margin = f.w * 0.085;
                let yCursor = isStory ? f.h * 0.28 : (f.h / 2) - (baseSize * 4.5);

                // Decoración Marco (solo si no es story y no hay fondo)
                if (!bgImg && !isStory) {
                    ctx.beginPath();
                    ctx.strokeStyle = "rgba(255,255,255,0.08)";
                    ctx.lineWidth = 1.5;
                    const m = margin * 0.4;
                    ctx.moveTo(m, m); ctx.lineTo(f.w - m, m); ctx.lineTo(f.w - m, f.h - m); ctx.lineTo(m, f.h - m); ctx.closePath();
                    ctx.stroke();
                }

                // 2. BADGE
                if (c.badge) {
                    ctx.font = `700 ${Math.floor(baseSize * 0.65)}px Inter`;
                    const badgePadX = baseSize * 0.9;
                    const badgeText = c.badge.toUpperCase();
                    const badgeWidth = ctx.measureText(badgeText).width + (badgePadX * 2);

                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    roundRect(ctx, margin, yCursor + 4, badgeWidth, baseSize * 1.5, 20);
                    ctx.fill();

                    ctx.fillStyle = bgImg ? 'rgba(255,255,255,0.2)' : t.badge;
                    if (t.badge === '#fff' && !bgImg) ctx.strokeStyle = '#eee';

                    roundRect(ctx, margin, yCursor, badgeWidth, baseSize * 1.5, 20);
                    ctx.fill();

                    ctx.fillStyle = (bgImg || t.badge === '#ffffff') ? (t.badgeText || '#222') : '#fff';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(badgeText, margin + badgePadX, yCursor + (baseSize * 0.75));
                    yCursor += baseSize * 2.8;
                }

                // 3. TÍTULO
                const titleSize = isStory ? baseSize * 2.3 : baseSize * 1.9;
                ctx.font = `800 ${Math.floor(titleSize)}px Inter`;
                ctx.textBaseline = 'top';
                ctx.fillStyle = bgImg ? '#fff' : t.text;

                // Add shadow if bgImg exists
                if (bgImg) {
                    ctx.shadowColor = 'rgba(0,0,0,0.7)';
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetX = 2;
                    ctx.shadowOffsetY = 2;
                } else {
                    ctx.shadowColor = 'transparent';
                }

                // Procesar negritas (*texto*)
                const rawTitle = c.title.replace(/\*/g, '');

                // Simular tracking negativo
                ctx.save();
                // No hay letter-spacing nativo fácil en canvas standard, así que usamos font normal
                wrapText(ctx, rawTitle, margin, yCursor, f.w - (margin * 2), titleSize * 1.15);
                ctx.restore();

                // Calcular altura del título para posicionar lo siguiente
                const tWords = rawTitle.split(' ');
                let tLine = '';
                let tCount = 1;
                for (let w of tWords) {
                    if (ctx.measureText(tLine + w).width > f.w - (margin * 2)) {
                        tCount++; tLine = w + ' ';
                    } else tLine += w + ' ';
                }

                yCursor += (titleSize * 1.15 * tCount) + (baseSize * 0.8);

                // 4. SUBTÍTULO
                const subSize = isStory ? baseSize * 1.2 : baseSize * 1.0;
                ctx.font = `400 ${Math.floor(subSize)}px Inter`;
                ctx.fillStyle = bgImg ? '#eee' : t.text;
                ctx.globalAlpha = 0.95;
                const rawSub = c.subtitle.replace(/\*/g, '');
                wrapText(ctx, rawSub, margin, yCursor, f.w - (margin * 2), subSize * 1.5);
                ctx.globalAlpha = 1;

                // Calcular altura subtítulo
                const sWords = rawSub.split(' ');
                let sLine = '';
                let sCount = 1;
                for (let w of sWords) {
                    if (ctx.measureText(sLine + w).width > f.w - (margin * 2)) {
                        sCount++; sLine = w + ' ';
                    } else sLine += w + ' ';
                }
                yCursor += (subSize * 1.5 * sCount) + (baseSize * 1.5);

                // 5. CTA BUTTON
                if (c.cta) {
                    const ctaSize = isStory ? baseSize * 0.9 : baseSize * 0.8;
                    ctx.font = `700 ${Math.floor(ctaSize)}px Inter`;
                    const ctaPadX = baseSize * 1.4;
                    const ctaHeight = baseSize * 2.2;
                    const ctaWidth = ctx.measureText(c.cta).width + (ctaPadX * 2);

                    ctx.fillStyle = t.accent;

                    // Shadow Suave
                    ctx.shadowColor = "rgba(0,0,0,0.15)";
                    ctx.shadowBlur = 15;
                    ctx.shadowOffsetY = 8;

                    roundRect(ctx, margin, yCursor, ctaWidth, ctaHeight, 8);
                    ctx.fill();
                    ctx.shadowColor = "transparent";

                    ctx.fillStyle = (t.accent === '#fff' || t.accent === '#ffffff') ? '#111' : '#fff';
                    ctx.fillText(c.cta, margin + ctaPadX, yCursor + (baseSize * 0.5));
                }

                // 6. LOGO & MARCA
                const logoSize = baseSize * 0.7;
                const logoY = f.h - margin;

                ctx.textAlign = 'right';
                // Marca principal
                ctx.font = `800 ${Math.floor(logoSize)}px Inter`;
                ctx.fillStyle = bgImg ? 'rgba(255,255,255,0.9)' : t.text;

                // Shadow for Logo/Contact (lighter)
                if (bgImg) {
                    ctx.shadowColor = 'rgba(0,0,0,0.7)';
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetX = 1;
                    ctx.shadowOffsetY = 1;
                } else {
                    ctx.shadowColor = 'transparent';
                }

                ctx.fillText("Estudio ROER", f.w - margin, logoY - (logoSize * 1.4));

                // Web
                ctx.font = `400 ${Math.floor(logoSize * 0.85)}px Inter`;
                ctx.fillStyle = bgImg ? 'rgba(255,255,255,0.7)' : t.text;
                ctx.globalAlpha = 0.8;
                ctx.fillText("estudioroer.com", f.w - margin, logoY);
                ctx.globalAlpha = 1;

                // DOWNLOAD ACTION
                const filename = `ROER_${d.name}_${networks[currentNetwork].name}_${f.name}.png`;
                canvasEl.toBlob(async (blob) => {
                    if (savedDirectoryHandle) {
                        try {
                            const fileHandle = await savedDirectoryHandle.getFileHandle(filename, { create: true });
                            const writable = await fileHandle.createWritable();
                            await writable.write(blob);
                            await writable.close();
                        } catch (err) {
                            console.error('Failed to save to folder, falling back:', err);
                            saveAsFile(blob, filename);
                        }
                    } else {
                        saveAsFile(blob, filename);
                    }
                }, 'image/png');
            } // end drawCanvasContent

            function saveAsFile(blob, filename) {
                const link = document.createElement('a');
                link.download = filename;
                link.href = URL.createObjectURL(blob);
                link.click();
                URL.revokeObjectURL(link.href);
            }
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                    ctx.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, y);
        }

        async function downloadAll() {
            // Iterate sequentially for folder save
            for (let i = 0; i < days.length; i++) {
                selectDay(i);
                // Give valid time to render
                await new Promise(r => setTimeout(r, 400));
                await downloadCurrent('png');
            }
            // Reset to day 0
            setTimeout(() => selectDay(0), 500);
        }

        document.getElementById('bioText').addEventListener('input', function () {
            weekContent[days[currentDay].id].bio = this.textContent;
            updateBioChars();
        });

        init();
    </script>
</body>

</html>
