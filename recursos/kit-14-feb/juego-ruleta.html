<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta de Premios - Estudio ROER</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #d4af37;
            --bg: #fff0f5;
            --text: #333;
            --white: #ffffff;
            --love: #e11d48;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-y: auto;
            /* Allow scrolling */
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--love);
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-align: center;
        }

        .wheel-container {
            position: relative;
            width: 80vmin;
            height: 80vmin;
            max-width: 320px;
            max-height: 320px;
            margin: 10px auto;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 10px solid var(--white);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            background: conic-gradient(#FF9AA2 0deg 60deg,
                    #FFB7B2 60deg 120deg,
                    #FFDAC1 120deg 180deg,
                    #E2F0CB 180deg 240deg,
                    #B5EAD7 240deg 300deg,
                    #C7CEEA 300deg 360deg);
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20%;
            height: 20%;
            background: white;
            border-radius: 50%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--primary);
            z-index: 20;
        }

        .btn-spin {
            background: var(--love);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
            transition: transform 0.2s;
            max-width: 90%;
        }

        .btn-spin:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-spin:active {
            transform: scale(0.95);
        }

        #result {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            min-height: 40px;
            text-align: center;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }

        .back-link {
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
            max-width: 400px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            color: #555;
            font-weight: 600;
        }

        .color-box {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
    </style>
</head>

<body>

    <h1>¡Gira y Gana! 🎁</h1>
    <p style="color: #666; text-align: center; margin-bottom: 10px;">Premios instantáneos para tu hogar</p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
            <div class="wheel-center">ROER</div>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="color-box" style="background: #FF9AA2;"></span> Evaluación GRATIS</div>
        <div class="legend-item"><span class="color-box" style="background: #FFB7B2;"></span> 5% Dcto. Regularización
        </div>
        <div class="legend-item"><span class="color-box" style="background: #FFDAC1;"></span> Guía Impresa Regalo</div>
        <div class="legend-item"><span class="color-box" style="background: #E2F0CB;"></span> Asesoría Express</div>
        <div class="legend-item"><span class="color-box" style="background: #B5EAD7;"></span> 10% Dcto. Diseño</div>
        <div class="legend-item"><span class="color-box" style="background: #C7CEEA;"></span> Inténtalo de nuevo</div>
    </div>

    <div id="result"></div>
    <button class="btn-spin" id="spinBtn" onclick="spin()">GIRAR AHORA</button>

    <a href="../feria.html" class="back-link">← Volver al Hub</a>

    <script>
        const wheel = document.getElementById('wheel');
        const resultText = document.getElementById('result');
        const spinBtn = document.getElementById('spinBtn');
        let spinning = false;

        const prizes = [
            "Evaluación GRATIS", // 0-60
            "5% Desc. Regularización", // 60-120
            "Guía Impresa de Regalo", // 120-180
            "Asesoría Express (15min)", // 180-240
            "10% Desc. Diseño", // 240-300
            "¡Inténtalo de nuevo!" // 300-360
        ];

        function spin() {
            if (spinning) return;
            spinning = true;
            spinBtn.disabled = true;
            resultText.textContent = "";

            const extraSpins = 5 * 360;
            const randomDegree = Math.floor(Math.random() * 360);
            const totalDegree = extraSpins + randomDegree;

            wheel.style.transform = `rotate(${totalDegree}deg)`;

            setTimeout(() => {
                spinning = false;
                spinBtn.disabled = false;
                spinBtn.textContent = "GIRAR OTRA VEZ";

                const actualDegree = totalDegree % 360;
                const winningAngle = (360 - actualDegree) % 360;
                const sliceIndex = Math.floor(winningAngle / 60);

                const prize = prizes[sliceIndex];

                resultText.textContent = `🎉 Ganaste: ${prize}`;
                celebrate();

            }, 4000);
        }

        function celebrate() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = -10 + 'px';
                confetti.style.backgroundColor = ['#FF9AA2', '#FFB7B2', '#FFDAC1', '#E2F0CB', '#B5EAD7', '#C7CEEA'][Math.floor(Math.random() * 6)];
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 5000);
            }
        }
    </script>

</body>

</html>
