<!DOCTYPE html>
<html lang="es-CL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubicador Pro 2.0 | Zona VIP Estudio ROER</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Outfit:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #3fb8af;
            --secondary: #ff9e9d;
            --dark: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
            --border: rgba(63, 184, 175, 0.3);
            --row-alt: rgba(255, 255, 255, 0.03);
            --row-hover: rgba(63, 184, 175, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--text-main);
            line-height: 1.6;
            background-image: radial-gradient(circle at top right, rgba(63, 184, 175, 0.1), transparent),
                radial-gradient(circle at bottom left, rgba(255, 158, 157, 0.05), transparent);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: -1px;
            background: linear-gradient(45deg, var(--primary), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .spreadsheet-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .sheet-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .sheet-table th {
            background: rgba(0, 0, 0, 0.4);
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 15px 10px;
            text-align: left;
            border-bottom: 2px solid var(--border);
            font-size: 0.75rem;
        }

        .sheet-table td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        .sheet-table tr:nth-child(even) {
            background: var(--row-alt);
        }

        .sheet-table tr:hover {
            background: var(--row-hover);
        }

        .col-logic {
            width: 110px;
        }

        select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--primary);
            padding: 4px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .category-row {
            background: rgba(63, 184, 175, 0.1) !important;
            font-weight: 800;
            color: var(--primary);
        }

        .category-row td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
        }

        input {
            background: transparent;
            border: 1px solid transparent;
            color: white;
            padding: 4px 8px;
            width: 100%;
            border-radius: 4px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }

        input:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            border: none;
        }

        .col-n {
            width: 50px;
            text-align: center;
        }

        .col-dim {
            width: 80px;
            text-align: center;
        }

        .col-qty {
            width: 100px;
            font-weight: 600;
            color: var(--secondary);
            text-align: right;
        }

        .col-total {
            width: 120px;
            font-weight: 800;
            color: var(--primary);
            text-align: right;
        }

        .col-deduction {
            width: 80px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ff4d4d;
            cursor: pointer;
            font-size: 0.8rem;
            opacity: 0.5;
            transition: 0.3s;
        }

        .btn-delete:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .btn-add-mini {
            background: rgba(63, 184, 175, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.3s;
            float: right;
        }

        .btn-add-mini:hover {
            background: var(--primary);
            color: black;
        }

        .deduction-toggle {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8rem;
            border: 1px solid #ff9e9d;
            color: #ff9e9d;
            transition: 0.3s;
        }

        .deduction-toggle.deduction-active {
            background: #ff9e9d;
            color: black;
        }

        .sheet-footer {
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-top: 1px solid var(--border);
        }

        .grand-total-box {
            text-align: right;
        }

        .grand-total-val {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .actions {
            display: flex;
            gap: 15px;
        }

        .btn-primary {
            background: var(--primary);
            color: black;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 800;
            border: 1px solid var(--primary);
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(63, 184, 175, 0.4);
        }

        .btn-outline:hover {
            background: rgba(63, 184, 175, 0.1);
        }

        .is-deduction {
            color: #ff9e9d !important;
        }

        @media (max-width: 768px) {
            .spreadsheet-container {
                overflow-x: auto;
            }

            .container {
                padding: 10px;
            }

            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="captureArea">
        <header>
            <h1>CUBICADOR PRO 2.0</h1>
            <p style="color:var(--text-dim);">Gestión Profesional de Cantidades y Presupuesto</p>
        </header>

        <div class="spreadsheet-container">
            <table class="sheet-table">
                <thead>
                    <tr>
                        <th style="width: 80px;">+/-</th>
                        <th>Partida / Elemento</th>
                        <th class="col-logic">Lógica</th>
                        <th class="col-n">N°</th>
                        <th class="col-dim">L (m)</th>
                        <th class="col-dim">A (m)</th>
                        <th class="col-dim">H / Fact.</th>
                        <th class="col-qty">Cantidad</th>
                        <th style="width: 50px;">Und.</th>
                        <th class="col-dim">P. Unit ($)</th>
                        <th class="col-total">Subtotal</th>
                    </tr>
                </thead>
                <tbody id="sheetBody">
                    <!-- Categoría: Fundaciones -->
                    <tr class="category-row">
                        <td class="col-deduction"><button class="btn-delete" onclick="removeCategory(this)"
                                title="Eliminar categoría">✕</button></td>
                        <td colspan="9">1. OBRA GRUESA Y FUNDACIONES</td>
                        <td><button class="btn-add-mini" onclick="addItemToCategory(this)">+ Item</button></td>
                    </tr>
                    <tr data-type="item">
                        <td class="col-deduction">
                            <button class="btn-delete" onclick="removeRow(this)" title="Quitar item">✕</button>
                            <span class="deduction-toggle" onclick="toggleDeduction(this)"
                                title="Convertir en Resta/Deducción">⊖</span>
                        </td>
                        <td><input type="text" value="Excavación Cimientos Eje A-B"></td>
                        <td>
                            <select onchange="calculateRow(this)">
                                <option value="vol">Volumen</option>
                                <option value="exc" selected>Excavación (+10%)</option>
                                <option value="sup">Superficie</option>
                                <option value="tech">Techumbre</option>
                            </select>
                        </td>
                        <td class="col-n"><input type="number" value="1" oninput="calculateRow(this)"></td>
                        <td class="col-dim"><input type="number" value="10.5" oninput="calculateRow(this)"></td>
                        <td class="col-dim"><input type="number" value="0.4" oninput="calculateRow(this)"></td>
                        <td class="col-dim"><input type="number" value="0.6" oninput="calculateRow(this)"></td>
                        <td class="col-qty">2.77</td>
                        <td><input type="text" value="m3" style="text-align:center;"></td>
                        <td class="col-dim"><input type="number" value="15000" oninput="calculateRow(this)"></td>
                        <td class="col-total">$41.550</td>
                    </tr>
                    <tr data-type="item">
                        <td class="col-deduction">
                            <button class="btn-delete" onclick="removeRow(this)" title="Quitar item">✕</button>
                            <span class="deduction-toggle" onclick="toggleDeduction(this)"
                                title="Convertir en Resta/Deducción">⊖</span>
                        </td>
                        <td><input type="text" value="Zapata Aislada Tipo Z1"></td>
                        <td>
                            <select onchange="calculateRow(this)">
                                <option value="vol" selected>Volumen</option>
                                <option value="exc">Excavación (+10%)</option>
                                <option value="sup">Superficie</option>
                                <option value="tech">Techumbre</option>
                            </select>
                        </td>
                        <td class="col-n"><input type="number" value="8" oninput="calculateRow(this)"></td>
                        <td class="col-dim"><input type="number" value="0.6" oninput="calculateRow(this)"></td>
                        <td class="col-dim"><input type="number" value="0.6" oninput="calculateRow(this)"></td>
                        <td class="col-dim"><input type="number" value="0.5" oninput="calculateRow(this)"></td>
                        <td class="col-qty">1.44</td>
                        <td><input type="text" value="m3" style="text-align:center;"></td>
                        <td class="col-dim"><input type="number" value="110000" oninput="calculateRow(this)"></td>
                        <td class="col-total">$158.400</td>
                    </tr>

                    <!-- Categoría: Muros -->
                    <tr class="category-row">
                        <td class="col-deduction"><button class="btn-delete" onclick="removeCategory(this)"
                                title="Eliminar categoría">✕</button></td>
                        <td colspan="9">2. MUROS Y ESTRUCTURA (PISO 1 Y 2)</td>
                        <td><button class="btn-add-mini" onclick="addItemToCategory(this)">+ Item</button></td>
                    </tr>
                    <tr data-type="item">
                        <td class="col-deduction">
                            <button class="btn-delete" onclick="removeRow(this)" title="Quitar item">✕</button>
                            <span class="deduction-toggle" onclick="toggleDeduction(this)"
                                title="Convertir en Resta/Deducción">⊖</span>
                        </td>
                        <td><input type="text" value="Muro 1 (Eje 1-A)"></td>
                        <td>
                            <select onchange="calculateRow(this)">
                                <option value="vol">Volumen</option>
                                <option value="exc">Excavación (+10%)</option>
                                <option value="sup" selected>Superficie</option>
                                <option value="tech">Techumbre</option>
                            </select>
                        </td>
                        <td class="col-n"><input type="number" value="1" oninput="calculateRow(this)"></td>
                        <td class="col-dim"><input type="number" value="15.0" oninput="calculateRow(this)"></td>
                        <td class="col-dim"><input type="number" value="1.0" oninput="calculateRow(this)"></td>
                        <td class="col-dim"><input type="number" value="2.4" oninput="calculateRow(this)"></td>
                        <td class="col-qty">36.00</td>
                        <td><input type="text" value="m2" style="text-align:center;"></td>
                        <td class="col-dim"><input type="number" value="12000" oninput="calculateRow(this)"></td>
                        <td class="col-total">$432.000</td>
                    </tr>
                </tbody>
            </table>

            <div class="sheet-footer">
                <div class="actions">
                    <button class="btn-primary" onclick="addCategory()">+ CATEGORÍA</button>
                    <button class="btn-outline" onclick="exportPDF()">DESCARGAR PDF</button>
                </div>
                <div class="grand-total-box">
                    <div style="color:#888; text-transform:uppercase; font-size:0.7rem; letter-spacing:1px;">Presupuesto
                        Final</div>
                    <div class="grand-total-val" id="grandTotal">$631.950</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateRow(input) {
            const row = input.closest('tr');
            const logic = row.querySelector('select').value;
            const n = parseFloat(row.querySelector('.col-n input').value) || 0;
            const dims = row.querySelectorAll('.col-dim input');
            const l = parseFloat(dims[0].value) || 0;
            const a = parseFloat(dims[1].value) || 0;
            const h = parseFloat(dims[2].value) || 0;
            const price = parseFloat(dims[3].value) || 0;
            const isDeduction = row.querySelector('.deduction-toggle').classList.contains('deduction-active');

            // Habilitar/Deshabilitar campos según lógica
            dims[1].disabled = (logic === 'sup');
            if (logic === 'sup') dims[1].value = 1;

            let qty = 0;
            if (logic === 'vol') qty = n * (l * a * h);
            else if (logic === 'sup') qty = n * (l * h);
            else if (logic === 'exc') qty = n * (l * a * h) * 1.1;
            else if (logic === 'tech') qty = n * (l * a) * h;

            if (isDeduction) qty = -qty;

            row.querySelector('.col-qty').innerText = qty.toFixed(2);
            const subtotal = Math.round(qty * price);
            row.querySelector('.col-total').innerText = '$' + subtotal.toLocaleString('es-CL');

            if (isDeduction) {
                row.querySelector('.col-qty').classList.add('is-deduction');
                row.querySelector('.col-total').classList.add('is-deduction');
            } else {
                row.querySelector('.col-qty').classList.remove('is-deduction');
                row.querySelector('.col-total').classList.remove('is-deduction');
            }

            updateGrandTotal();
        }

        function toggleDeduction(btn) {
            btn.classList.toggle('deduction-active');
            const row = btn.closest('tr');
            row.classList.toggle('is-deduction-row');
            calculateRow(btn);
        }

        function updateGrandTotal() {
            let total = 0;
            document.querySelectorAll('.sheet-table tr[data-type="item"]').forEach(row => {
                const subStr = row.querySelector('.col-total').innerText.replace('$', '').replace(/\./g, '');
                total += parseFloat(subStr) || 0;
            });
            document.getElementById('grandTotal').innerText = '$' + total.toLocaleString('es-CL');
        }

        function addItemToCategory(btn) {
            const categoryRow = btn.closest('tr');
            const tbody = document.getElementById('sheetBody');
            const newRow = document.createElement('tr');
            newRow.setAttribute('data-type', 'item');
            newRow.innerHTML = `
                <td class="col-deduction">
                    <button class="btn-delete" onclick="removeRow(this)" title="Quitar item">✕</button>
                    <span class="deduction-toggle" onclick="toggleDeduction(this)">⊖</span>
                </td>
                <td><input type="text" placeholder="Concepto..." oninput="calculateRow(this)"></td>
                <td>
                    <select onchange="calculateRow(this)">
                        <option value="vol">Volumen</option>
                        <option value="exc">Excavación (+10%)</option>
                        <option value="sup" selected>Superficie</option>
                        <option value="tech">Techumbre</option>
                    </select>
                </td>
                <td class="col-n"><input type="number" value="1" oninput="calculateRow(this)"></td>
                <td class="col-dim"><input type="number" value="0" oninput="calculateRow(this)"></td>
                <td class="col-dim"><input type="number" value="1" oninput="calculateRow(this)"></td>
                <td class="col-dim"><input type="number" value="1" oninput="calculateRow(this)"></td>
                <td class="col-qty">0.00</td>
                <td><input type="text" value="m2" style="text-align:center;"></td>
                <td class="col-dim"><input type="number" value="0" oninput="calculateRow(this)"></td>
                <td class="col-total">$0</td>
            `;
            categoryRow.after(newRow);
            updateGrandTotal();
        }

        function removeRow(btn) {
            btn.closest('tr').remove();
            updateGrandTotal();
        }

        function removeCategory(btn) {
            if (confirm('¿Seguro que quieres borrar toda esta categoría y sus ítems?')) {
                const row = btn.closest('tr');
                let next = row.nextElementSibling;
                while (next && !next.classList.contains('category-row')) {
                    const toDelete = next;
                    next = next.nextElementSibling;
                    toDelete.remove();
                }
                row.remove();
                updateGrandTotal();
            }
        }

        function addCategory() {
            const tbody = document.getElementById('sheetBody');
            const newRow = document.createElement('tr');
            newRow.className = 'category-row';
            newRow.innerHTML = `
                <td class="col-deduction"><button class="btn-delete" onclick="removeCategory(this)">✕</button></td>
                <td colspan="9"><input type="text" value="NUEVA CATEGORÍA" style="font-weight:800; color:var(--primary); text-transform:uppercase;"></td>
                <td><button class="btn-add-mini" onclick="addItemToCategory(this)">+ Item</button></td>
            `;
            tbody.appendChild(newRow);
        }

        function exportPDF() {
            const element = document.getElementById('captureArea');
            const opt = {
                margin: 0.5,
                filename: 'Cubicacion_Proyecto.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, backgroundColor: '#1a1a1a' },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>

</html>
